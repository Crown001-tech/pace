[project]
name = "pace-audio"
version = "0.1.0"
description = "PACE Python audio worker: validation, FFmpeg loudness/transcoding/peaks, Whisper transcription, and script alignment"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av>=14.0.0,<18.0.0",
    "boto3>=1.35,<2.0",
    "faster-whisper>=1.1,<2.0",
    "httpx>=0.27,<1.0",
    "num2words>=0.5.13,<0.6",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "starlette>=0.41,<1.0",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pace_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
