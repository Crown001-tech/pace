[package]
name = "pace-render"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pace-render-worker"
path = "src/main.rs"

[dependencies]
pace-db = { path = "../pace-db" }
pace-engine = { path = "../pace-engine" }
pace-jobs = { path = "../pace-jobs" }
pace-storage = { path = "../pace-storage" }

fast_image_resize = "5.5"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
uuid = { version = "1.15", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
