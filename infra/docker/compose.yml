services:
  postgres:
    image: postgres:16-alpine
    container_name: pace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
      POSTGRES_DB: pace
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pace-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pace
      MINIO_ROOT_PASSWORD: pace-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m

volumes:
  pg-data:
  minio-data:
