services:
  postgres:
    image: postgres:16-alpine
    container_name: pace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
      POSTGRES_DB: pace
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pace-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pace
      MINIO_ROOT_PASSWORD: pace-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    container_name: pace-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 pace pace-secret;
      /usr/bin/mc mb --ignore-existing myminio/pace;
      exit 0;
      "

volumes:
  pg-data:
  minio-data:
